<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Masterclass Viewer</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-color: #0e1621;
            --header-bg: #17212b;
            --msg-bg: #182533;
            --text-color: #f5f5f5;
            --accent-color: #64b5f6;
            --secondary-text: #7f91a4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }

        .title { font-weight: bold; font-size: 1.1rem; }

        .controls { display: flex; gap: 10px; align-items: center; }

        .lang-toggle {
            background: #242f3d;
            border: 1px solid #38495c;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-btn {
            background: #2b5278;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message-card {
            background-color: var(--msg-bg);
            border-radius: 12px;
            padding: 12px 16px;
            word-wrap: break-word;
        }

        .message-card img, .message-card video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .folder-btn {
            width: 100%;
            text-align: left;
            margin: 4px 0;
            background: #202b36;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .back-btn {
            background: #38495c;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title" id="ui-title">Masterclass Viewer</div>
        <div class="controls">
            <button class="login-btn" id="btn-login" onclick="requestDriveAccess()">Войти</button>
            <select class="lang-toggle" id="lang-select" onchange="switchLanguage(this.value)">
                <option value="de">DE 🇩🇪</option>
                <option value="ru" selected>RU 🇷🇺</option>
            </select>
        </div>
    </header>

    <div id="feed">
        <div class="message-card" id="status-msg">
            <div id="ui-welcome">Нажмите «Войти», чтобы открыть файлы с Google Диска.</div>
        </div>
    </div>

    <script>
        const CLIENT_ID = "811107839225-fnvskc6g3edktnhlv69h5rd5k9s82bfa.apps.googleusercontent.com";
        let accessToken = null;
        let tokenClient;

        const i18n = {
            de: {
                title: "Masterclass Viewer",
                login: "Anmelden",
                logout: "Angemeldet",
                welcome: "Klicken Sie auf «Anmelden», um auf Google Drive zuzugreifen.",
                loading: "Lade Dateien...",
                empty: "Keine Ordner oder Dateien gefunden.",
                back: "← Zurück"
            },
            ru: {
                title: "Мастер-классы Telegram",
                login: "Войти",
                logout: "Вы вошли",
                welcome: "Нажмите «Войти», чтобы открыть файлы с Google Диска.",
                loading: "Загрузка файлов...",
                empty: "Ничего не найдено.",
                back: "← Назад"
            }
        };

        let currentLang = 'ru';

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('ui-title').innerText = i18n[lang].title;
            if (!accessToken) {
                document.getElementById('btn-login').innerText = i18n[lang].login;
            } else {
                document.getElementById('btn-login').innerText = i18n[lang].logout;
            }
            document.getElementById('ui-welcome').innerText = i18n[lang].welcome;
        }

        window.onload = function() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.readonly',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('btn-login').innerText = i18n[currentLang].logout;
                        document.getElementById('status-msg').style.display = 'none';
                        loadDriveContents('root');
                    }
                },
            });
        };

        function requestDriveAccess() {
            if (tokenClient) {
                tokenClient.requestAccessToken();
            }
        }

        async function loadDriveContents(folderId, parentId = null) {
            const feed = document.getElementById('feed');
            feed.innerHTML = `<div>${i18n[currentLang].loading}</div>`;

            try {
                // Запрашиваем элементы текущей папки
                const response = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id, name, mimeType)`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const data = await response.json();

                feed.innerHTML = '';

                if (parentId) {
                    const backBtn = document.createElement('button');
                    backBtn.className = 'back-btn';
                    backBtn.innerText = i18n[currentLang].back;
                    backBtn.onclick = () => loadDriveContents(parentId);
                    feed.appendChild(backBtn);
                }

                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        if (file.mimeType === 'application/vnd.google-apps.folder') {
                            const btn = document.createElement('button');
                            btn.className = 'folder-btn';
                            btn.innerText = '📁 ' + file.name;
                            btn.onclick = () => loadDriveContents(file.id, folderId);
                            feed.appendChild(btn);
                        } else {
                            const card = document.createElement('div');
                            card.className = 'message-card';

                            if (file.mimeType.startsWith('image/')) {
                                card.innerHTML = `<b>${file.name}</b><br><img src="https://www.googleapis.com/drive/v3/files/${file.id}?alt=media" headers="Authorization: Bearer ${accessToken}">`;
                            } else if (file.mimeType.startsWith('video/')) {
                                card.innerHTML = `<b>${file.name}</b><br><video controls src="https://www.googleapis.com/drive/v3/files/${file.id}?alt=media"></video>`;
                            } else {
                                card.innerHTML = `<b>📄 ${file.name}</b>`;
                            }
                            feed.appendChild(card);
                        }
                    });
                } else {
                    feed.innerHTML = `<div>${i18n[currentLang].empty}</div>`;
                }
            } catch (err) {
                feed.innerHTML = `<div>Ошибка: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
