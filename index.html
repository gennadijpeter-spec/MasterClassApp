<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterclass Telegram Viewer</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <style>
        :root {
            --bg-color: #0e1621;
            --header-bg: #17212b;
            --msg-bg: #182533;
            --text-color: #f5f5f5;
            --accent-color: #64b5f6;
            --secondary-text: #7f91a4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Верхняя панель управления */
        header {
            background-color: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: #2b5278;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background-color: #386899;
        }

        .lang-toggle {
            background: #242f3d;
            border: 1px solid #38495c;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Лента сообщений в стиле Telegram */
        #feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message-card {
            background-color: var(--msg-bg);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            word-wrap: break-word;
        }

        .message-card img, .message-card video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--secondary-text);
            text-align: right;
            margin-top: 6px;
        }

        .folder-btn {
            width: 100%;
            text-align: left;
            margin: 4px 0;
            background: #202b36;
        }
    </style>
</head>
<body>

    <header>
        <div class="title" id="ui-title">Masterclass Viewer</div>
        <div class="controls">
            <button id="btn-login" onclick="handleAuth()">Anmelden / Войти</button>
            <select class="lang-toggle" id="lang-select" onchange="switchLanguage(this.value)">
                <option value="de">DE 🇩🇪</option>
                <option value="ru" selected>RU 🇷🇺</option>
            </select>
        </div>
    </header>

    <div id="feed">
        <div class="message-card" id="status-msg">
            <div id="ui-welcome">Авторизуйтесь через Google, чтобы открыть мастер-классы с вашего Google Диска.</div>
        </div>
    </div>

    <script>
        // Данные конфигурации Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD1WuMSMUSgExtpaX8akj4Aggqzn5zcQI",
            authDomain: "masterclassapp-a8a03.firebaseapp.com",
            projectId: "masterclassapp-a8a03",
            storageBucket: "masterclassapp-a8a03.firebasestorage.app",
            messagingSenderId: "811107839225",
            appId: "1:811107839225:web:64ee772394b862772a4628"
        };

        firebase.initializeApp(firebaseConfig);

        const i18n = {
            de: {
                title: "Masterclass Viewer",
                login: "Anmelden mit Google",
                welcome: "Bitte melden Sie sich an, um Ihre Google Drive-Dateien anzusehen.",
                selectFolder: "Ordner auswählen",
                loading: "Lade Dateien...",
                empty: "Keine Inhalte gefunden."
            },
            ru: {
                title: "Мастер-классы Telegram",
                login: "Войти через Google",
                welcome: "Пожалуйста, авторизуйтесь для доступа к Google Диску.",
                selectFolder: "Выбрать папку",
                loading: "Загрузка файлов...",
                empty: "В этой папке ничего не найдено."
            }
        };

        let currentLang = 'ru';
        let accessToken = null;

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('ui-title').innerText = i18n[lang].title;
            document.getElementById('btn-login').innerText = i18n[lang].login;
            document.getElementById('ui-welcome').innerText = i18n[lang].welcome;
        }

        function handleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/drive.readonly');

            firebase.auth().signInWithPopup(provider).then((result) => {
                accessToken = result.credential.accessToken;
                document.getElementById('status-msg').style.display = 'none';
                loadDriveFolders();
            }).catch((error) => {
                alert("Ошибка входа: " + error.message);
            });
        }

        async function loadDriveFolders() {
            const feed = document.getElementById('feed');
            feed.innerHTML = `<div>${i18n[currentLang].loading}</div>`;

            const response = await fetch("https://www.googleapis.com/drive/v3/files?q=mimeType='application/vnd.google-apps.folder'&fields=files(id, name)", {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const data = await response.json();

            feed.innerHTML = '';
            if (data.files && data.files.length > 0) {
                data.files.forEach(folder => {
                    const btn = document.createElement('button');
                    btn.className = 'folder-btn';
                    btn.innerText = '📁 ' + folder.name;
                    btn.onclick = () => loadFolderContents(folder.id);
                    feed.appendChild(btn);
                });
            } else {
                feed.innerHTML = `<div>${i18n[currentLang].empty}</div>`;
            }
        }

        async function loadFolderContents(folderId) {
            const feed = document.getElementById('feed');
            feed.innerHTML = `<div>${i18n[currentLang].loading}</div>`;

            const response = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents&fields=files(id, name, mimeType, webContentLink)`, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const data = await response.json();

            feed.innerHTML = '';
            data.files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'message-card';

                if (file.mimeType.startsWith('image/')) {
                    card.innerHTML = `<b>${file.name}</b><br><img src="https://www.googleapis.com/drive/v3/files/${file.id}?alt=media" headers="Authorization: Bearer ${accessToken}">`;
                } else if (file.mimeType.startsWith('video/')) {
                    card.innerHTML = `<b>${file.name}</b><br><video controls src="https://www.googleapis.com/drive/v3/files/${file.id}?alt=media"></video>`;
                } else {
                    card.innerHTML = `<b>📄 ${file.name}</b>`;
                }
                feed.appendChild(card);
            });
        }
    </script>
</body>
</html>
