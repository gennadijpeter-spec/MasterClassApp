<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1621">
    <link rel="manifest" href="manifest.json">
    <title>Masterclass Viewer</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-color: #0e1621;
            --header-bg: #17212b;
            --msg-bg: #182533;
            --text-color: #f5f5f5;
            --accent-color: #64b5f6;
            --secondary-text: #7f91a4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }

        .title { font-weight: bold; font-size: 1.1rem; }
        .controls { display: flex; gap: 8px; align-items: center; }

        .lang-toggle {
            background: #242f3d;
            border: 1px solid #38495c;
            color: #fff;
            padding: 7px 9px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-btn {
            background: #2b5278;
            color: #fff;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }

        article, .message-card {
            background: var(--msg-bg) !important;
            color: var(--text-color) !important;
            border-radius: 12px !important;
            padding: 16px !important;
            margin: 0 !important;
            box-shadow: none !important;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        article img, article video,
        .message-card img, .message-card video {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            margin-top: 10px;
        }

        .folder-btn {
            width: 100%;
            text-align: left;
            background: #202b36;
            color: #fff;
            border: 1px solid #2a3949;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
        }

        .folder-btn:hover { background: #29394a; }

        .back-btn {
            align-self: flex-start;
            background: #38495c;
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .section-title {
            color: var(--accent-color);
            font-weight: bold;
            margin: 10px 0 2px;
        }

        .muted { color: var(--secondary-text); font-size: 0.9rem; }
        .error { color: #ffb4ab; white-space: pre-wrap; }
    </style>
</head>

<body>
<header>
    <div class="title" id="ui-title">Мастер-классы Telegram</div>
    <div class="controls">
        <button class="login-btn" id="btn-login" type="button">Войти</button>
        <select class="lang-toggle" id="lang-select">
            <option value="de">DE 🇩🇪</option>
            <option value="ru" selected>RU 🇷🇺</option>
        </select>
    </div>
</header>

<main id="feed">
    <div class="message-card" id="status-msg">
        <div id="ui-welcome">Нажмите «Войти», чтобы открыть файлы с Google Диска.</div>
    </div>
</main>

<script>
    const CLIENT_ID = "811107839225-fnvskc6g3edktnhlv69h5rd5k9s82bfa.apps.googleusercontent.com";
    const DRIVE_API = "https://www.googleapis.com/drive/v3";
    const FOLDER_MIME = "application/vnd.google-apps.folder";

    let accessToken = null;
    let tokenClient = null;
    let currentLang = "ru";
    let navigationStack = [];
    let objectUrls = [];

    const i18n = {
        ru: {
            title: "Мастер-классы Telegram",
            login: "Войти",
            logout: "Выйти",
            welcome: "Нажмите «Войти», чтобы открыть файлы с Google Диска.",
            loading: "Загрузка мастер-класса...",
            empty: "В этой папке ничего не найдено.",
            back: "← Назад",
            home: "⌂ Главная",
            myDrive: "📁 Мой диск",
            loadError: "Ошибка Google Drive"
        },
        de: {
            title: "Masterclass Viewer",
            login: "Anmelden",
            logout: "Abmelden",
            welcome: "Melden Sie sich an, um auf Google Drive zuzugreifen.",
            loading: "Masterclass wird geladen...",
            empty: "Keine Dateien in diesem Ordner gefunden.",
            back: "← Zurück",
            home: "⌂ Startseite",
            myDrive: "📁 Mein Drive",
            loadError: "Google-Drive-Fehler"
        }
    };

    const t = key => i18n[currentLang][key] || key;

    window.addEventListener("load", () => {
        document.getElementById("btn-login").addEventListener("click", handleLoginButton);
        document.getElementById("lang-select").addEventListener("change", e => switchLanguage(e.target.value));
        initializeGoogleAuth();
    });

    function initializeGoogleAuth() {
        if (!window.google?.accounts?.oauth2) {
            setTimeout(initializeGoogleAuth, 1000);
            return;
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/drive.readonly",
            callback: async response => {
                if (response.access_token) {
                    accessToken = response.access_token;
                    updateLoginButton();
                    navigationStack = [];
                    await loadHome();
                }
            }
        });
    }

    function handleLoginButton() {
        if (accessToken) {
            accessToken = null;
            navigationStack = [];
            clearObjectUrls();
            updateLoginButton();
            showWelcome();
            return;
        }
        tokenClient.requestAccessToken({ prompt: "consent" });
    }

    function updateLoginButton() {
        document.getElementById("btn-login").textContent = accessToken ? t("logout") : t("login");
    }

    function switchLanguage(lang) {
        currentLang = lang;
        document.getElementById("ui-title").textContent = t("title");
        updateLoginButton();
        if (!accessToken) showWelcome();
    }

    async function driveRequest(url) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    }

    async function listAllFiles(q) {
        const params = new URLSearchParams({
            q,
            pageSize: "1000",
            orderBy: "name",
            fields: "files(id,name,mimeType)"
        });
        const data = await driveRequest(`${DRIVE_API}/files?${params.toString()}`);
        return data.files || [];
    }

    async function loadHome() {
        showLoading();
        navigationStack = [];
        try {
            const rootFiles = await listAllFiles("'root' in parents and trashed = false");
            const feed = document.getElementById("feed");
            feed.replaceChildren();

            appendSection(t("myDrive"), rootFiles);
        } catch (err) {
            showError(err.message);
        }
    }

    function appendSection(title, files) {
        const feed = document.getElementById("feed");
        const heading = document.createElement("div");
        heading.className = "section-title";
        heading.textContent = title;
        feed.appendChild(heading);

        files.forEach(file => {
            if (file.mimeType === FOLDER_MIME) {
                const btn = document.createElement("button");
                btn.className = "folder-btn";
                btn.textContent = "📁 " + file.name;
                btn.onclick = () => navigateTo(file.id);
                feed.appendChild(btn);
            }
        });
    }

    function navigateTo(folderId) {
        navigationStack.push(folderId);
        loadFolder(folderId);
    }

    async function loadFolder(folderId) {
        showLoading();
        try {
            const files = await listAllFiles(`'${folderId}' in parents and trashed = false`);
            const folders = files.filter(f => f.mimeType === FOLDER_MIME);
            const htmlFile = files.find(f => f.name.toLowerCase() === 'index.html');

            const feed = document.getElementById("feed");
            feed.replaceChildren();

            const navBar = document.createElement("div");
            navBar.className = "nav-bar";

            const back = document.createElement("button");
            back.className = "back-btn";
            back.textContent = t("back");
            back.onclick = goBack;
            navBar.appendChild(back);

            const home = document.createElement("button");
            home.className = "back-btn";
            home.textContent = t("home");
            home.onclick = loadHome;
            navBar.appendChild(home);

            feed.appendChild(navBar);

            if (folders.length > 0) {
                folders.forEach(f => {
                    const btn = document.createElement("button");
                    btn.className = "folder-btn";
                    btn.textContent = "📁 " + f.name;
                    btn.onclick = () => navigateTo(f.id);
                    feed.appendChild(btn);
                });
            } else if (htmlFile) {
                await renderMasterclassFeed(htmlFile.id, files);
            } else {
                renderRawFiles(files);
            }

        } catch (error) {
            showError(t("loadError") + ": " + error.message);
        }
    }

    async function renderMasterclassFeed(htmlFileId, folderFiles) {
        const feed = document.getElementById("feed");

        const response = await fetch(`${DRIVE_API}/files/${htmlFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
        });
        const htmlText = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        
        // Достаем статьи (посты Telegram)
        const articles = doc.querySelectorAll('article');

        const fileMap = new Map();
        folderFiles.forEach(f => fileMap.set(f.name.toLowerCase(), f));

        for (const art of articles) {
            const articleClone = art.cloneNode(true);

            // Обрабатываем все теги img, video, source и ссылки
            const mediaSources = articleClone.querySelectorAll('img, source, a');

            for (const el of mediaSources) {
                let attrName = el.hasAttribute('src') ? 'src' : (el.hasAttribute('href') ? 'href' : null);
                if (!attrName) continue;

                const rawPath = el.getAttribute(attrName);
                if (!rawPath || rawPath.startsWith('http') || rawPath.startsWith('data:')) continue;

                const fileName = rawPath.split('/').pop().toLowerCase();
                const matchedFile = fileMap.get(fileName);

                if (matchedFile) {
                    const blobUrl = await fetchFileBlob(matchedFile.id);
                    if (blobUrl) {
                        if (el.tagName.toLowerCase() === 'a') {
                            el.setAttribute('href', blobUrl);
                        } else {
                            el.setAttribute(attrName, blobUrl);
                            if (el.tagName.toLowerCase() === 'source' && el.parentElement) {
                                el.parentElement.src = blobUrl;
                            }
                        }
                    }
                }
            }

            feed.appendChild(articleClone);
        }
    }

    async function fetchFileBlob(fileId) {
        try {
            const res = await fetch(`${DRIVE_API}/files/${fileId}?alt=media`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            objectUrls.push(url);
            return url;
        } catch (e) {
            return null;
        }
    }

    function renderRawFiles(files) {
        const feed = document.getElementById("feed");
        files.forEach(file => {
            const card = document.createElement("div");
            card.className = "message-card";
            card.textContent = "📄 " + file.name;
            feed.appendChild(card);
        });
    }

    function goBack() {
        if (navigationStack.length > 1) {
            navigationStack.pop();
            loadFolder(navigationStack[navigationStack.length - 1]);
        } else {
            loadHome();
        }
    }

    function clearObjectUrls() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls = [];
    }

    function showLoading() {
        const feed = document.getElementById("feed");
        feed.replaceChildren();
        const card = document.createElement("div");
        card.className = "message-card";
        card.textContent = t("loading");
        feed.appendChild(card);
    }

    function showError(msg) {
        const feed = document.getElementById("feed");
        feed.replaceChildren();
        const card = document.createElement("div");
        card.className = "message-card error";
        card.textContent = msg;
        feed.appendChild(card);
    }

    function showWelcome() {
        const feed = document.getElementById("feed");
        feed.replaceChildren();
        const card = document.createElement("div");
        card.className = "message-card";
        card.textContent = t("welcome");
        feed.appendChild(card);
    }
</script>
</body>
</html>
